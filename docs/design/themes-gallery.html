<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VectraOS — 12 Alternative Theme Mockups Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,600..800&family=Barlow+Condensed:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --ui-bg: #0c0f14;
  --ui-panel: #141922;
  --ui-border: #262f3f;
  --ui-ink: #e8edf5;
  --ui-dim: #8c99b0;
  --ui-accent: #f2bb26;
  --ui-blue: #4c8bf5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ui-bg);
  color: var(--ui-ink);
  font: 400 14px/1.45 'IBM Plex Sans', system-ui, sans-serif;
  overflow-x: hidden;
}

/* Gallery Header & Controls */
.deck {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12, 15, 20, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--ui-border);
  padding: 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.deck-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand h1 {
  margin: 0;
  font: 800 19px/1.1 'Archivo', sans-serif;
  font-variation-settings: 'wdth' 115;
  letter-spacing: 0.02em;
}
.brand .sub {
  color: var(--ui-dim);
  font: 400 12.5px/1.2 'IBM Plex Mono', monospace;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.seg {
  display: inline-flex;
  background: #080a0e;
  border: 1px solid var(--ui-border);
  border-radius: 5px;
  padding: 2px;
  gap: 2px;
}
.seg button, .act-btn {
  all: unset;
  cursor: pointer;
  padding: 5px 11px;
  font: 600 12px/1.2 'Archivo', sans-serif;
  color: var(--ui-dim);
  border-radius: 3px;
  white-space: nowrap;
  transition: background .12s, color .12s;
}
.seg button:hover, .act-btn:hover {
  color: var(--ui-ink);
}
.seg button.on {
  background: #232c3d;
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.act-btn {
  background: #18202c;
  border: 1px solid var(--ui-border);
  color: var(--ui-ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.act-btn.on {
  background: var(--ui-accent);
  color: #111;
  border-color: var(--ui-accent);
  font-weight: 700;
}
.knob-lbl {
  font: 600 11px/1 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ui-dim);
  padding: 0 6px 0 8px;
  align-self: center;
}

/* Theme Strip */
.theme-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.t-pill {
  all: unset;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  background: var(--ui-panel);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  font: 600 12px/1.1 'Archivo', sans-serif;
  color: var(--ui-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.t-pill:hover {
  border-color: #465670;
  color: var(--ui-ink);
}
.t-pill.on {
  border-color: var(--ui-accent);
  background: #1e2533;
  color: #fff;
  box-shadow: 0 0 0 1px var(--ui-accent);
}
.t-pill .num {
  font: 600 10.5px/1 'IBM Plex Mono', monospace;
  opacity: .65;
}
.t-pill .dot {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,.35);
  position: relative;
  overflow: hidden;
}
.t-pill .dot i {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 6px;
  height: 6px;
}

/* Main Stage */
.stage {
  padding: 24px;
  max-width: 1968px;
  margin: 0 auto;
}

/* Theme Banner Meta */
.theme-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px 24px;
  margin-bottom: 16px;
  padding: 14px 18px;
  background: var(--ui-panel);
  border: 1px solid var(--ui-border);
  border-radius: 6px;
}
.theme-meta h2 {
  margin: 0;
  font: 800 22px/1.1 'Archivo', sans-serif;
  font-variation-settings: 'wdth' 112;
}
.theme-meta .tag {
  font: 600 11px/1 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 3px 7px;
  border-radius: 3px;
  background: #232c3d;
  color: var(--ui-accent);
}
.theme-meta p {
  margin: 4px 0 0;
  color: var(--ui-dim);
  font-size: 13.5px;
  max-width: 95ch;
}
.seam-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.seam-badge {
  font: 400 11.5px/1.2 'IBM Plex Mono', monospace;
  padding: 4px 8px;
  background: #0c0f15;
  border: 1px solid var(--ui-border);
  border-radius: 3px;
  color: #b8c4d9;
}
.seam-badge b { color: #fff; }

/* Scaled 1920x1080 Viewport Container */
.viewport-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--ui-border);
  border-radius: 6px;
  background: #000;
  box-shadow: 0 18px 48px rgba(0,0,0,.55);
}
.canvas-1080 {
  width: 1920px;
  height: 1080px;
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  overflow: hidden;
  user-select: none;
}

/* Grid Overview (All 12) */
.grid-12 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(540px, 1fr));
  gap: 22px;
}
.card-12 {
  background: var(--ui-panel);
  border: 1px solid var(--ui-border);
  border-radius: 7px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color .15s, transform .15s;
}
.card-12:hover {
  border-color: #526685;
}
.card-12.active-card {
  border-color: var(--ui-accent);
  box-shadow: 0 0 0 1px var(--ui-accent);
}
.card-head {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--ui-border);
}
.card-head .title-wrap {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.card-head .idx {
  font: 600 12px/1 'IBM Plex Mono', monospace;
  color: var(--ui-accent);
}
.card-head h3 {
  margin: 0;
  font: 800 16px/1.1 'Archivo', sans-serif;
  font-variation-settings: 'wdth' 110;
}
.card-head .cat {
  font: 500 11px/1 'IBM Plex Mono', monospace;
  color: var(--ui-dim);
}
.card-foot {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--ui-border);
  font-size: 12px;
  color: var(--ui-dim);
}
.swatch-row {
  display: flex;
  gap: 3px;
}
.swatch-row i {
  width: 16px;
  height: 16px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,.25);
  display: inline-block;
}
.dual-stack {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Modal for theme(6) source */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 12, 0.78);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(860px, 100%);
  max-height: 86vh;
  background: #10151e;
  border: 1px solid #354259;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,.7);
}
.modal-head {
  padding: 12px 18px;
  border-bottom: 1px solid var(--ui-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-body {
  padding: 16px 18px;
  overflow: auto;
  font: 400 12.5px/1.55 'IBM Plex Mono', monospace;
  color: #d4e0f0;
  white-space: pre;
  margin: 0;
}

/* ==========================================================================
   VECTRAOS VECTOR CHROME ENGINE (Parameterized by CSS Variables per Theme)
   ========================================================================== */
.vx {
  font-family: var(--font-ui, 'Archivo', sans-serif);
  font-variation-settings: 'wdth' var(--ui-wdth, 92);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.3;
}
.vx .mono {
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
}
.vx .display-face {
  font-family: var(--font-display, 'Archivo', sans-serif);
  font-variation-settings: 'wdth' var(--display-wdth, 118);
}

/* Desktop Surface & Patterns */
.vx-desk {
  background-color: var(--desk);
  background-image: var(--desk-bg, repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 1px, transparent 1px 5px), repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 5px));
  background-size: var(--desk-bg-size, auto);
}

/* CRT / Scanline / Grid Overlay when theme enables effects */
.vx-desk::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: var(--fx-overlay, none);
  z-index: 40;
}

/* Windows */
.vx .win {
  position: absolute;
  display: flex;
  flex-direction: column;
  filter: var(--win-shadow, drop-shadow(0 10px 14px rgba(8,14,22,.38)) drop-shadow(0 2px 2px rgba(8,14,22,.35)));
}
.vx .win.focused-win {
  filter: var(--win-shadow-focus, drop-shadow(0 10px 14px rgba(8,14,22,.38)) drop-shadow(0 2px 2px rgba(8,14,22,.35)));
}

/* Window Tab / Titlebar Shapes */
.vx .tab {
  align-self: var(--tab-align, stretch);
  width: var(--tab-width, auto);
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--tab-h, 27px);
  padding: 0 6px;
  background: var(--tab-focus-bg);
  color: var(--tab-focus-ink, var(--ink));
  border: var(--border-w, 1px) solid var(--outline);
  border-bottom: 0;
  box-shadow: var(--tab-focus-bevel);
  border-radius: var(--tab-radius, 4px 4px 0 0);
  clip-path: var(--tab-clip, none);
  font-weight: 700;
  font-style: var(--tab-style, normal);
  font-size: 13px;
  letter-spacing: var(--tab-track, 0);
  text-transform: var(--tab-case, none);
  font-variation-settings: 'wdth' 100;
  white-space: nowrap;
  position: relative;
}
.vx .tab.off {
  background: var(--tab-off-bg);
  box-shadow: var(--tab-off-bevel);
  color: var(--ink-dim);
  border-color: var(--outline);
}
/* Optional Amiga/MUI drag stripes inside wide titlebars */
.vx .tab > .tbar-title {
  flex: var(--title-flex, 0 1 auto);
  text-align: var(--title-align, left);
  overflow: hidden;
  text-overflow: ellipsis;
}
.vx .tab .drag-stripes {
  display: var(--drag-stripes-display, none);
  flex: 1;
  height: 11px;
  margin: 0 4px;
  background: repeating-linear-gradient(0deg, var(--bevel-light) 0 2px, transparent 2px 4px, var(--bevel-dark) 4px 5px);
  opacity: .65;
}
.vx .tbar-right {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
/* Close, Minimize & Zoom boxes */
.vx .cbox {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  border: 1px solid var(--outline);
  border-radius: var(--cbox-radius, 2px);
  background: var(--cbox-focus-bg);
  box-shadow: var(--cbox-bevel, inset 1px 1px 0 rgba(255,255,255,.65));
  position: relative;
}
.vx .tab.off .cbox {
  background: var(--cbox-off-bg);
}
.vx .mbox::after {
  content: '';
  position: absolute;
  left: 3px;
  bottom: 3px;
  width: 7px;
  height: 2px;
  background: var(--outline);
}
.vx .zbox::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 6px;
  height: 6px;
  border: 1px solid var(--outline);
  background: var(--well);
}

/* Window Frame */
.vx .frame {
  flex: 1;
  border: var(--frame-border-w, 1px) solid var(--outline);
  background: var(--chrome);
  padding: var(--frame-pad, 3px);
  box-shadow: var(--frame-bevel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: var(--frame-radius, 0 3px 3px 3px);
  clip-path: var(--frame-clip, none);
}
.vx .win.focused-win .frame {
  border-color: var(--frame-focus-stroke, var(--outline));
}

/* NeXT bottom resize bar */
.vx .next-resize {
  display: var(--next-bar-display, none);
  height: 9px;
  background: var(--chrome);
  border-top: 1px solid var(--outline);
  box-shadow: inset 1px 1px 0 var(--bevel-light);
  position: relative;
}
.vx .next-resize::before, .vx .next-resize::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 24px;
  border-right: 1px solid var(--outline);
}
.vx .next-resize::before { left: 0; }
.vx .next-resize::after { right: 0; border-right: 0; border-left: 1px solid var(--outline); }

/* Menu bar inside window */
.vx .menu {
  display: flex;
  gap: 18px;
  height: 23px;
  align-items: center;
  padding: 0 10px;
  background: var(--menubar-bg);
  border-bottom: 1px solid var(--bevel-dark);
  font-size: 13px;
  color: var(--ink);
}

/* Data Well */
.vx .well {
  background: var(--well);
  background-image: var(--well-pattern, none);
  background-size: var(--well-pattern-size, auto);
  color: var(--ink);
  border: 1px solid var(--control);
  box-shadow: var(--well-bevel);
}

/* LCD Readout */
.vx .lcd {
  background: var(--lcd);
  color: var(--lcd-ink);
  border: 1px solid var(--control);
  box-shadow: var(--lcd-bevel, inset 1px 1px 0 rgba(0,0,0,.75));
  text-shadow: var(--lcd-glow, 0 0 6px rgba(140,240,130,.38));
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
}

/* Icons */
.vx .ico {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 92px;
  text-align: center;
  font-size: 12.5px;
}
.vx .lbl {
  padding: 1px 5px;
  border-radius: 2px;
}
.vx-desk > div > .ico .lbl, .vx-desk > .ico .lbl {
  color: var(--desk-ink, #fff);
  text-shadow: var(--desk-label-shadow, 0 1px 0 #111, 0 0 4px #111);
}
.vx .ico.sel .lbl {
  background: var(--selection);
  color: var(--ink-on-select);
  text-shadow: none;
}

/* Scrollbar */
.vx .sb {
  width: 15px;
  background: var(--sb-track);
  border-left: 1px solid var(--control);
  display: flex;
  flex-direction: column;
}
.vx .arr {
  height: 15px;
  background: var(--btn-bg);
  border-bottom: 1px solid var(--control);
  box-shadow: var(--btn-bevel);
}
.vx .thumb {
  margin: 2px 1px;
  background: var(--thumb-bg);
  border: 1px solid var(--control);
  box-shadow: var(--btn-bevel);
  border-radius: var(--btn-radius, 2px);
}

/* Deskbar */
.vx .db {
  position: absolute;
  top: 0;
  right: 0;
  width: 236px;
  background: var(--panel);
  border-left: 1px solid var(--outline);
  border-bottom: 1px solid var(--outline);
  box-shadow: var(--frame-bevel), -4px 6px 14px rgba(0,0,0,.35);
  border-bottom-left-radius: var(--frame-radius-corner, 4px);
  clip-path: var(--db-clip, none);
  z-index: 25;
}
.vx .db-head {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 12px;
  width: 100%;
  border-bottom: 1px solid var(--outline);
  background: var(--menubar-bg);
  color: var(--ink);
}
.vx .dbrow {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 30px;
  border-top: 1px solid var(--bevel-light);
  border-bottom: 1px solid var(--bevel-dark);
  font-size: 13px;
  color: var(--ink);
}
.vx .dbrow.active-app {
  background: var(--selection);
  color: var(--ink-on-select);
  font-weight: 700;
  border-top-color: transparent;
}
.vx .wsp {
  height: 44px;
  border: 1px solid var(--outline);
  background: var(--desk);
  position: relative;
  box-shadow: inset 1px 1px 0 rgba(0,0,0,.45);
}
.vx .wsp.on {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}
.vx .mode {
  position: absolute;
  right: 2px;
  bottom: 2px;
  font-size: 9.5px;
  font-weight: 800;
  padding: 0 3px;
  background: var(--menu);
  color: var(--ink);
  border: 1px solid var(--outline);
  line-height: 12px;
}
.vx .mini {
  position: absolute;
  background: var(--chrome);
  border: 1px solid var(--outline);
}
.vx .mini.f {
  border-top: 3px solid var(--focus-ring);
}

/* Kit Controls */
.vx fieldset {
  border: var(--group-border, 2px groove var(--bevel-light));
  border-radius: var(--btn-radius, 4px);
  margin: 0;
  padding: 8px 10px 10px;
}
.vx legend {
  font-weight: 700;
  padding: 0 6px;
  font-size: 12.5px;
  color: var(--ink);
}
.vx .btn {
  height: 26px;
  padding: 0 14px;
  border: 1px solid var(--control-edge, var(--outline));
  border-radius: var(--btn-radius, 4px);
  background: var(--btn-bg);
  box-shadow: var(--btn-bevel);
  font: inherit;
  font-weight: 600;
  font-size: 12.5px;
  text-transform: var(--btn-case, none);
  letter-spacing: var(--btn-track, 0);
  color: var(--ink);
  clip-path: var(--btn-clip, none);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.vx .btn.def {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
.vx .btn.dis {
  color: var(--ink-disabled);
  border-color: var(--bevel-dark);
  box-shadow: none;
}
.vx .pop {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 24px;
  padding: 0 6px 0 9px;
  border: 1px solid var(--outline);
  border-radius: var(--btn-radius, 3px);
  background: var(--btn-bg);
  box-shadow: var(--btn-bevel);
  font-size: 12.5px;
  color: var(--ink);
}
.vx .pop::after {
  content: '';
  border: 4px solid transparent;
  border-top: 5px solid var(--ink);
  margin-top: 5px;
}
.vx .fld {
  height: 24px;
  border: 1px solid var(--control);
  box-shadow: var(--well-bevel);
  background: var(--field-bg, var(--well));
  color: var(--ink);
  padding: 0 7px;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
}
.vx .chk {
  width: 14px;
  height: 14px;
  border: 1px solid var(--outline);
  background: var(--field-bg, var(--well));
  box-shadow: var(--well-bevel);
  position: relative;
  display: inline-block;
}
.vx .chk.on::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1px;
  width: 4px;
  height: 8px;
  border: solid var(--ink);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.vx .rdo {
  width: 14px;
  height: 14px;
  border: 1px solid var(--outline);
  border-radius: 50%;
  background: var(--field-bg, var(--well));
  box-shadow: var(--well-bevel);
  position: relative;
  display: inline-block;
}
.vx .rdo.on::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--selection);
}
.vx .rg {
  display: flex;
  align-self: flex-start;
}
.vx .rg span {
  padding: 4px 10px;
  border: 1px solid var(--control);

let state = {
  activeId: 'graphite',
  view: 'desk',        // 'grid' | 'desk' | 'kit' | 'dual'

  highContrast: false

function renderTitlebarHTML(t, label, isOff) {
  const isBeTab = (t.css && t.css['--tab-align'] === 'flex-start');
  const rightWidgets = isBeTab
    ? `<span class="tbar-right"><span class="cbox zbox"></span></span>`
    : `<span class="tbar-right"><span class="cbox mbox"></span><span class="cbox zbox"></span></span>`;
  return `<div class="tab${isOff ? ' off' : ''}"><span class="cbox"></span><span class="tbar-title">${label}</span><span class="drag-stripes"></span>${rightWidgets}</div>`;
}

function getSelectionColor(t) {
  if (state.highContrast) return '#00ffff';
  if (state.accent === 'cool') return t.tokens.accentCool;
  if (state.accent === 'warm') return t.tokens.accentWarm;
  return t.tokens.accentTheme;
}

function buildStyleVars(t) {
  const tk = t.tokens;
  const sel = getSelectionColor(t);

  if (state.highContrast) {
    return [
      `--font-display:'${t.fonts.display}',sans-serif`,
      `--font-body:'${t.fonts.body}',sans-serif`,
      `--font-mono:'${t.fonts.mono}',monospace`,
      `--font-ui:'${t.fonts.ui}',sans-serif`,
      `--desk:#000000`,
      `--desk-bg:none`,
      `--chrome:#000000`,
      `--chrome-behind:#000000`,
      `--well:#000000`,
      `--well-pattern:none`,
      `--field-bg:#000000`,
      `--menu:#000000`,
      `--panel:#000000`,

      `--cbox-focus-bg:#000000`,

      `--tab-align:${(t.css && t.css['--tab-align']) || 'stretch'}`
    ].join(';');
  }

  const baseVars = {
    '--font-display': `'${t.fonts.display}',sans-serif`,
    '--font-body': `'${t.fonts.body}',sans-serif`,
    '--font-mono': `'${t.fonts.mono}',monospace`,
    '--font-ui': `'${t.fonts.ui}',sans-serif`,
    '--desk': tk.desk,
    '--chrome': tk.chrome,

    '--well': tk.well,

    '--panel': tk.panel,
    '--outline': tk.outline,
    '--bevel-light': tk.bevelLight,
    '--bevel-dark': tk.bevelDark,
    '--control': tk.control,
    '--ink': tk.ink,

    '--tab-focus-ink': tk.tabFocusInk,
    '--tab-focus-bevel': `inset 1px 1px 0 ${tk.tabFocusLight}, inset -1px 0 0 ${tk.tabFocusDark}`,
    '--tab-off-bg': `linear-gradient(${tk.chrome}, ${tk.chromeBehind})`,
    '--tab-off-bevel': `inset 1px 1px 0 ${tk.bevelLight}, inset -1px 0 0 ${tk.bevelDark}`,
    '--cbox-focus-bg': `linear-gradient(135deg, ${tk.tabFocusLight}, ${tk.tabFocus})`,
    '--cbox-off-bg': `linear-gradient(135deg, ${tk.bevelLight}, ${tk.chromeBehind})`,
    '--frame-bevel': `inset 1px 1px 0 ${tk.bevelLight}, inset -1px -1px 0 ${tk.bevelDark}`,
    '--menubar-bg': `linear-gradient(${tk.menu}, ${tk.chrome})`,
    '--well-bevel': `inset 1px 1px 0 ${tk.bevelDark}`,

    '--thumb-bg': `linear-gradient(90deg, ${tk.bevelLight}, ${tk.chrome})`

  Object.assign(baseVars, t.css || {});
  return Object.entries(baseVars).map(([k, v]) => `${k}:${v}`).join(';');
}

# ${t.summary}
#
# Format: theme(6). Checked by \`vx theme check\`.
theme=${t.id} title="${t.title}" inherits=${t.inherits} version=1
\tauthor="VectraOS Theme Storyboard" licence=BSD-3-Clause

# Required surface, edge and ink roles (docs/theming.md §2.1)
role=desk color=${h(tk.desk)}
role=chrome color=${h(tk.chrome)}
role=chrome.behind color=${h(tk.chromeBehind)}

# Accent knob (D108, D119)

role=tab.focus.light color=${h(tk.tabFocusLight)}
role=tab.focus.dark color=${h(tk.tabFocusDark)}
role=focus color=${h(tk.tabFocus)}
role=lcd color=${h(tk.lcd)}
role=lcd.ink color=${h(tk.lcdInk)}
role=live color=${h(tk.live)}
role=alert color=${h(tk.alert)}
role=warning color=${h(tk.warning)}
role=realtime color=${h(tk.alert)}
role=lamp.local color=${h(tk.lampLocal)}
role=lamp.agent color=${h(tk.lampAgent)}
role=lamp.egress color=${h(tk.lampEgress)}
role=lamp.swarm color=${h(tk.lampSwarm)}

# Typeface mappings (docs/theming.md §2.4)
typeface=display family="${t.fonts.display}" weight=800
typeface=body family="${t.fonts.body}" weight=400
typeface=mono family="${t.fonts.mono}" weight=400
typeface=ui family="${t.fonts.ui}" weight=600
`;
}

function renderStrip() {
  const strip = document.getElementById('theme-strip');
  strip.innerHTML = THEMES.map(t => `
    <button type="button" class="t-pill ${t.id === state.activeId ? 'on' : ''}" onclick="selectTheme('${t.id}')">
      <span class="num">${t.num}</span>
      <span class="dot" style="background:${t.tokens.desk}">
        <i style="background:${t.tokens.tabFocus}"></i>
      </span>
      <span>${t.title}</span>
    </button>
  `).join('');
}

function renderStage() {
  const stage = document.getElementById('stage');
  const activeTheme = THEMES.find(t => t.id === state.activeId) || THEMES[0];

  if (state.view === 'grid') {
    const altThemes = THEMES.slice(0, 12);
    stage.innerHTML = `
      <div class="theme-meta">
        <div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="tag">12 Alternative Mockups</span>
            <h2>VectraOS Theme Exploration Matrix</h2>
          </div>
          <p>Click any theme card below to inspect it at full 1920×1080 resolution, or use the top toolbar to toggle Space/Tile mode, Accent knobs, and High Contrast across all 12 mockups simultaneously.</p>
        </div>
      </div>
      <div class="grid-12">
        ${altThemes.map(t => `
          <article class="card-12 ${t.id === state.activeId ? 'active-card' : ''}">
            <div class="card-head">
              <div class="title-wrap">
                <span class="idx">#${t.num}</span>
                <h3>${t.title}</h3>
                <span class="cat">· ${t.category}</span>
              </div>
              <div style="display:flex;gap:6px">
                <button type="button" class="act-btn" style="padding:3px 8px;font-size:11px" onclick="inspectTheme('${t.id}','desk')">Desktop</button>
                <button type="button" class="act-btn" style="padding:3px 8px;font-size:11px" onclick="inspectTheme('${t.id}','kit')">Kit</button>
              </div>
            </div>
            <div class="viewport-frame" style="border:0;border-radius:0;cursor:pointer" onclick="inspectTheme('${t.id}','desk')">
              ${renderDesktopSceneHTML(t)}
            </div>
            <div class="card-foot">
              <div class="swatch-row">
                <i style="background:${t.tokens.desk}" title="desk ${t.tokens.desk}"></i>
                <i style="background:${t.tokens.chrome}" title="chrome ${t.tokens.chrome}"></i>
                <i style="background:${t.tokens.well}" title="well ${t.tokens.well}"></i>
                <i style="background:${t.tokens.tabFocus}" title="tab.focus ${t.tokens.tabFocus}"></i>
                <i style="background:${getSelectionColor(t)}" title="selection ${getSelectionColor(t)}"></i>
                <i style="background:${t.tokens.lcd}" title="lcd ${t.tokens.lcd}"></i>
                <i style="background:${t.tokens.lcdInk}" title="lcd.ink ${t.tokens.lcdInk}"></i>
              </div>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11px">inherits=${t.inherits}</span>
            </div>
          </article>
        `).join('')}
      </div>
    `;
    scaleAllViewports();
    return;
  }

  const metaBanner = `
    <div class="theme-meta">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="tag">#${activeTheme.num} · ${activeTheme.category}</span>
          <h2>${activeTheme.title}</h2>
        </div>
        <p>${activeTheme.summary}</p>
      </div>
      <div class="seam-badges">
        ${activeTheme.seams.map(s => `<span class="seam-badge">${s}</span>`).join('')}
      </div>
    </div>
  `;

  if (state.view === 'desk') {
    stage.innerHTML = `
      ${metaBanner}
      <div class="viewport-frame">
        ${renderDesktopSceneHTML(activeTheme)}
      </div>
    `;
  } else if (state.view === 'kit') {
    stage.innerHTML = `
      ${metaBanner}
      <div class="viewport-frame">
        ${renderKitSceneHTML(activeTheme)}
      </div>
    `;
  } else if (state.view === 'dual') {
    stage.innerHTML = `
      ${metaBanner}
      <div class="dual-stack">
        <div class="viewport-frame">
          ${renderDesktopSceneHTML(activeTheme)}
        </div>
        <div class="viewport-frame">
          ${renderKitSceneHTML(activeTheme)}
        </div>
      </div>
    `;
  }
  scaleAllViewports();
}

function scaleAllViewports() {
  document.querySelectorAll('.viewport-frame').forEach(frame => {
    const canvas = frame.querySelector('.canvas-1080');
    if (!canvas) return;
    const scale = frame.clientWidth / 1920;
    canvas.style.transform = `scale(${scale})`;
  });
}

function selectTheme(id) {
  state.activeId = id;
  renderStrip();
  renderStage();
}

function inspectTheme(id, viewMode) {
  state.activeId = id;
  state.view = viewMode;
  updateToolbarButtons();
  renderStrip();
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setView(v) {
  state.view = v;
  updateToolbarButtons();
  renderStage();
}

function setWorkspaceMode(m) {
  state.wspMode = m;
  updateToolbarButtons();
  renderStage();
}

function setAccent(a) {
  state.accent = a;
  updateToolbarButtons();
  renderStage();
}

function toggleHighContrast() {
  state.highContrast = !state.highContrast;
  updateToolbarButtons();
  renderStage();
}

function updateToolbarButtons() {
  ['grid', 'desk', 'kit', 'dual'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('on', state.view === v);
  });
  ['space', 'tile'].forEach(m => {
    document.getElementById('wsp-' + m).classList.toggle('on', state.wspMode === m);
  });
  ['theme', 'cool', 'warm'].forEach(a => {
    document.getElementById('acc-' + a).classList.toggle('on', state.accent === a);
  });
  document.getElementById('btn-hc').classList.toggle('on', state.highContrast);
}

function openSourceModal() {
  const t = THEMES.find(x => x.id === state.activeId) || THEMES[0];
  document.getElementById('modal-title').textContent = `ui/theme/themes/${t.id}`;
  document.getElementById('modal-code').textContent = buildThemeFileText(t);
  document.getElementById('source-modal').classList.add('open');
}

function closeSourceModal() {
  document.getElementById('source-modal').classList.remove('open');
}

function copyThemeSource() {
  const code = document.getElementById('modal-code').textContent;
  navigator.clipboard.writeText(code);
  const btn = document.getElementById('btn-copy');
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = 'Copy theme(6)'; }, 1400);
}

window.addEventListener('resize', scaleAllViewports);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSourceModal();
  if (document.getElementById('source-modal').classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const idx = THEMES.findIndex(t => t.id === state.activeId);
    const next = (idx + (e.key === 'ArrowRight' ? 1 : -1) + THEMES.length) % THEMES.length;
    selectTheme(THEMES[next].id);
  }
});

renderStrip();
renderStage();
</script>
</body>
</html>
