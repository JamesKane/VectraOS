# <arch>-unknown-vectraos-clang++.cfg: compiling C++ for VectraOS's native
# target with an unpatched clang, such as the pinned Fedora clang
# (ADR-0033 §3).
#
# Installed at the root of the sysroot and read with
# --config-system-dir=<sysroot>: clang looks for <triple>.cfg in its
# configuration directories, not in the sysroot; clang++ reads this file
# instead of <triple>.cfg, so it repeats every option. <CFGDIR> is this file's
# directory, the sysroot.
#
# It gives an unpatched clang what LLVM patches 0002 and 0003 give the
# patched one, for compiling. It does not link: for an operating system it
# does not know, unpatched clang links by running the host's gcc, which
# brings the host's start files and C library. Link with ld.lld and the
# response files beside this one (README.md).

# Patch 0002's predefined macro.
-D__vectraos__

# The sysroot. Clang's own headers come first, then <sysroot>/usr/include,
# and nothing of the host's: the patched driver's order.
--sysroot=<CFGDIR>

# libc++'s headers, from <sysroot>/usr/include/c++/v1. No language: the
# program's choice, as in <triple>.cfg (ADR-0033 §3, amended 2026-10-07);
# the system's own native programs ask for -std=c++23.
-stdlib=libc++

# No exceptions until libc++abi has them and libunwind arrives (ADR-0033
# §2a, M6 step 6f2). With them on, libc++'s inline throws need __cxa_throw
# and a personality routine that the libraries do not have yet.
-fno-exceptions

# Patch 0003's defaults: DWARF 5 when debugging is asked for (-gdwarf-5 would
# turn debugging on for every compile), frame pointers in every function,
# leaf functions included, asynchronous unwind tables, and no
# position-independent code.
-fdebug-default-version=5
-fno-omit-frame-pointer
-mno-omit-leaf-frame-pointer
-fasynchronous-unwind-tables
-fno-pic

# Patch 0003's toolchain sets math functions not to report through errno.
-fno-math-errno
