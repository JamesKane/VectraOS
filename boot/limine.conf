# Limine configuration for Vectra (config format, Limine v8 and later).
#
# Staged to /EFI/BOOT/limine.conf on the EFI system partition. On UEFI, Limine
# looks beside its own executable first, so a config there cannot be shadowed
# by a stray limine.conf further up the volume.

# No menu: this image exists to be booted by `just run`, and a three-second
# countdown on every edit-build-boot cycle is three seconds off every cycle.
timeout: 0
default_entry: 1

# Mirror the bootloader's own output to COM1: when a boot fails before the
# kernel gets control, this is the only place the reason appears, and the QEMU
# runner is headless by default.
#
# `quiet` suppresses everything except panics, which is the point -- Limine
# draws its progress line with per-character cursor addressing, and forty
# escape sequences spelling "Loading executable" at the top of every boot log
# buries the thing you opened the log to read.
serial: yes
quiet: yes

/Vectra
    protocol: limine
    # boot() is the partition this config was read from.
    path: boot():/vectra.elf
