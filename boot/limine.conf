# boot/limine.conf: Limine's configuration (ADR-0002). build copies it to
# /boot/limine/limine.conf on the EFI system partition. svcd is a module until
# bootfs exists (M2); the kernel finds it by name. ktest is the kernel's tests
# in user space, started instead of svcd with vx.root=ktest.

timeout: 0

/VectraOS
    protocol: limine
    path: boot():/boot/vx/kernel.elf
    module_path: boot():/boot/vx/svcd
    module_path: boot():/boot/vx/ktest
