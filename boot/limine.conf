# boot/limine.conf: Limine's configuration (ADR-0002). build copies it to
# /boot/limine/limine.conf on the EFI system partition. The kernel finds its
# modules by name: svcd, the root task; ktest, the kernel's tests in user space,
# started instead of svcd with vx.root=ktest; and bootfs.tar, the boot image
# (docs/04 §3.4), which the root task gets as a VMO.

timeout: 0

/VectraOS
    protocol: limine
    path: boot():/boot/vx/kernel.elf
    module_path: boot():/boot/vx/svcd
    module_path: boot():/boot/vx/ktest
    module_path: boot():/boot/vx/bootfs.tar
